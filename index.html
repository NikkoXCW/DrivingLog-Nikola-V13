<!DOCTYPE html>
<html>
<head>
  <title>Driving Log - Nikola V13</title>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Driving Log Entry</h2>
  <form id="form">

    <h3>Trip Overview</h3>
    <label>Date:</label><br>
    <input type="date" name="Date" required><br><br>
    
    <label>Driver Name:</label><br>
    <input type="text" name="driverName" required><br><br>

    <label>Start Point:</label><br>
    <input type="text" name="startPoint" required><br><br>

    <label>Destination:</label><br>
    <input type="text" name="destination" required><br><br>

    <label>Road Conditions:</label><br>
    <input type="text" name="roadConditions"><br><br>

    <label>Distance Travelled (km):</label><br>
    <input type="number" name="distanceTravelled"><br><br>

    <label>Trailer Type:</label><br>
    <input type="text" name="trailerType"><br><br>

    <label>Cargo Weight (kg):</label><br>
    <input type="number" name="cargoWeight"><br><br>

    <label>Cargo Description:</label><br>
    <input type="text" name="cargoDescription"><br><br>

    <h3>Trip Start</h3>
    <label>Start Temperature (°C):</label><br>
    <input type="number" name="startTemp"><br><br>

    <label>Start Time:</label><br>
    <input type="time" name="startTime"><br><br>

    <label>Start Odometer (km):</label><br>
    <input type="number" name="startOdometer"><br><br>

    <label>Start Battery SoC (%):</label><br>
    <input type="number" name="startSoc"><br><br>

    <label>Start H2 Pressure (bar):</label><br>
    <input type="number" name="startH2Pressure"><br><br>

    <h3>Trip End</h3>
    <label>End Temperature (°C):</label><br>
    <input type="number" name="endTemp"><br><br>

    <label>End Time:</label><br>
    <input type="time" name="endTime"><br><br>

    <label>End Odometer (km):</label><br>
    <input type="number" name="endOdometer"><br><br>

    <label>End Battery SoC (%):</label><br>
    <input type="number" name="endSoc"><br><br>

    <label>End H2 Pressure (bar):</label><br>
    <input type="number" name="endH2Pressure"><br><br>

    <h3>Notes</h3>
    <label>Additional Notes:</label><br>
    <textarea name="notes" rows="5" cols="50"></textarea><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      status.innerText = "Submitting...";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyNSFXrp2sR6gXZNLIIwJFQOTzR8Yab8HZg1IUOW_sA6Ern5101gaRejqYMbp4E9hRo/exec", {
          method: "POST",
          body: params
        });

        const text = await response.text();
        console.log("Response:", text);
        status.innerText = "Submitted successfully!";
        form.reset();
      } catch (error) {
        console.error("Submission error:", error);
        status.innerText = "Submission failed.";
      }
    });
  </script>
</body>
</html>
